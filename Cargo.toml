[package]
name = "obsidian-memory"
version = "2.1.1"
edition = "2021"
rust-version = "1.75"
description = "Obsidian-backed persistent memory for Claude Code (single-binary Rust port)"
license = "MIT"
publish = false

[[bin]]
name = "obsidian-memory"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
fs2 = "0.4"
libc = "0.2"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
